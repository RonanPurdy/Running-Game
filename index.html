<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a38">
<title>Neon Dash — Endless Runner</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 0,#344879,#111a38 70%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{width:min(100%,960px)}header{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;gap:12px}.brand{font-weight:950;letter-spacing:.13em;color:#e5efff}.brand span{color:#65f3d0}.hud{display:flex;align-items:center;gap:clamp(8px,2vw,20px);font-size:clamp(11px,2vw,14px);font-weight:800;color:#dce6ff}.stat{white-space:nowrap}.stat b{color:#fff;margin-left:4px;font-variant-numeric:tabular-nums}button{font:inherit;cursor:pointer}#pause{border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:10px;padding:7px 11px;font-weight:900}.stage{position:relative;overflow:hidden;border:1px solid #c5dcff55;border-radius:18px;box-shadow:0 24px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:900/500}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:#10183170;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.card{width:min(100%,410px);padding:clamp(22px,5vw,38px);text-align:center;border:1px solid #ffffff45;border-radius:22px;background:linear-gradient(145deg,#293d6aef,#151d40f5);box-shadow:0 18px 55px #080d24aa}.eyebrow{color:#63f4d6;font-weight:900;letter-spacing:.18em;font-size:11px}h1{margin:8px 0;font-size:clamp(34px,7vw,54px);line-height:1;letter-spacing:-.05em}.card p{margin:12px 0 20px;color:#d7e1ff;line-height:1.55;font-size:14px}.action{width:100%;border:0;border-radius:13px;padding:14px 20px;color:#10233b;background:linear-gradient(100deg,#70f4d2,#bafc83);font-weight:950;letter-spacing:.08em;box-shadow:0 7px 0 #269d8d}.action:hover{filter:brightness(1.08);transform:translateY(-2px)}.hint{margin-top:16px;color:#aab9e2;font-size:12px}.footer{text-align:center;color:#91a1ca;font-size:11px;margin:11px 3px 0}@media(max-width:520px){body{padding:9px}.stage{border-radius:13px}header{margin-bottom:8px}.hud{gap:8px}#pause{padding:6px 8px}}
</style>
</head>
<body>
<main class="shell">
	<header><div class="brand">NEON <span>DASH</span></div><div class="hud" aria-live="polite"><div class="stat">SCORE <b id="score">0</b></div><div class="stat">COINS <b id="coins">0</b></div><div class="stat">BEST <b id="best">0</b></div><button id="pause" aria-label="Pause game">Ⅱ</button></div></header>
	<section class="stage" aria-label="Endless runner game"><canvas id="game" width="900" height="500" aria-label="Game area"></canvas>
		<div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">READY, RUNNER?</div><h1 id="title">Neon Dash</h1><p id="message">Leap over the blocks, scoop up coins, and see how far you can run.</p><button class="action" id="main">PLAY</button><div class="hint" id="hint">SPACE · W · ↑ to jump &nbsp; / &nbsp; Tap to jump</div></div></div>
	</section><div class="footer">A quick browser game · Your best score is saved on this device</div>
</main>
<script>
(()=>{
	'use strict';
	const c=document.querySelector('#game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),W=900,H=500,G=420;
	const overlay=$('overlay');let state='menu',last=0,time=0,score=0,coinCount=0,speed=330,spawn=1.1,coinSpawn=1.4,scroll=0;
	let obstacles=[],coins=[],particles=[];const player={x:145,y:G-58,w:42,h:58,vy:0,grounded:true,run:0};
	let best=0;try{best=Number(localStorage.getItem('neonDashBest'))||0}catch(_){}$('best').textContent=best;
	// Canvas uses a fixed logical size and is scaled for responsive displays.
	function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(c.width/W,0,0,c.height/H,0,0);draw()}
	addEventListener('resize',resize);
	function show(kind){overlay.hidden=kind==='playing';if(kind==='menu'){$('eyebrow').textContent='READY, RUNNER?';$('title').textContent='Neon Dash';$('message').textContent='Leap over the blocks, scoop up coins, and see how far you can run.';$('main').textContent='PLAY';$('hint').textContent='SPACE · W · ↑ to jump  /  Tap to jump'}else if(kind==='over'){$('eyebrow').textContent='RUN COMPLETE';$('title').textContent='Game Over';$('message').textContent=`Score: ${score} · Coins: ${coinCount}${score>=best?' · New best!':''}`;$('main').textContent='RESTART';$('hint').textContent='Press SPACE or tap RESTART to run again'}else if(kind==='paused'){$('eyebrow').textContent='TAKE A BREATHER';$('title').textContent='Paused';$('message').textContent='Your run is waiting right here.';$('main').textContent='RESUME';$('hint').textContent='Press P or ESC to resume'}}
	// Reset the round without starting another animation loop.
	function start(){time=score=coinCount=0;speed=330;spawn=1;coinSpawn=1.3;obstacles=[];coins=[];particles=[];player.y=G-player.h;player.vy=0;player.grounded=true;player.run=0;state='playing';show('playing');hud()}
	function pause(){if(state==='playing'){state='paused';show('paused')}else if(state==='paused'){state='playing';show('playing');last=performance.now()}}
	function jump(){if(state==='playing'&&player.grounded){player.vy=-690;player.grounded=false}}
	function hud(){$('score').textContent=score;$('coins').textContent=coinCount;$('best').textContent=best}
	$('main').onclick=()=>state==='paused'?pause():start();$('pause').onclick=()=>{if(state==='playing'||state==='paused')pause()};
	addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','w'].includes(k))e.preventDefault();if(k==='p'||k==='escape'){if(state==='playing'||state==='paused')pause();return}if([' ','arrowup','w'].includes(k)){if(state==='menu'||state==='over')start();else jump()}});
	c.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='menu'||state==='over')start();else if(state==='playing')jump()});
	function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
	function collect(q){q.taken=true;coinCount++;score+=50;for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,v=50+Math.random()*150;particles.push({x:q.x+12,y:q.y+12,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.65,max:.65})}}
	function end(){state='over';if(score>best){best=score;try{localStorage.setItem('neonDashBest',String(best))}catch(_){}}hud();show('over')}
	// The world scrolls left as the runner accelerates; collisions are checked every frame.
	function update(dt){if(state!=='playing')return;time+=dt;speed=Math.min(700,330+time*8);score=Math.floor(time*10)+coinCount*50;scroll=(scroll+speed*dt)%900;player.run+=dt*speed/45;player.vy+=1850*dt;player.y+=player.vy*dt;if(player.y+player.h>=G){player.y=G-player.h;player.vy=0;player.grounded=true}
		spawn-=dt;if(spawn<=0){const tall=Math.random()<.32,h=tall?68+Math.random()*22:42+Math.random()*17,w=tall?36:35+Math.random()*20;obstacles.push({x:W+20,y:G-h,w,h,color:Math.random()<.5?'#f05b78':'#9d62e8'});spawn=Math.max(.72,1.45+Math.random()*.8-time*.008)}
		coinSpawn-=dt;if(coinSpawn<=0){const n=3+Math.floor(Math.random()*3),base=G-105-Math.random()*80;for(let i=0;i<n;i++)coins.push({x:W+20+i*36,y:base-Math.sin(i/(n-1)*Math.PI)*18,w:24,h:24,phase:Math.random()*6.28,taken:false});coinSpawn=2.3+Math.random()*2}
		for(const o of obstacles)o.x-=speed*dt;for(const q of coins)q.x-=speed*dt;const box={x:player.x+7,y:player.y+5,w:player.w-14,h:player.h-7};if(obstacles.some(o=>hit(box,o))){end();return}for(const q of coins)if(!q.taken&&hit(box,{x:q.x+3,y:q.y+3,w:q.w-6,h:q.h-6}))collect(q);
		obstacles=obstacles.filter(o=>o.x+o.w>-30);coins=coins.filter(q=>q.x+q.w>-30&&!q.taken);particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt}hud()}
	function cloud(x,y,s){ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(x,y,34*s,12*s,0,0,7);ctx.ellipse(x-18*s,y-5*s,17*s,15*s,0,0,7);ctx.ellipse(x+2*s,y-10*s,21*s,19*s,0,0,7);ctx.ellipse(x+23*s,y-3*s,17*s,13*s,0,0,7);ctx.fill()}
	function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
	function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#67c9f1');sky.addColorStop(.68,'#b4eff2');sky.addColorStop(1,'#e5f7cc');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
		// Layered hills and clouds provide parallax scenery.
		ctx.fillStyle='#6abbb5';ctx.beginPath();ctx.moveTo(0,330);for(let x=0;x<=W;x+=90)ctx.quadraticCurveTo(x+45,270+Math.sin(x*.03)*28,x+90,330);ctx.lineTo(W,G);ctx.lineTo(0,G);ctx.fill();for(let i=0;i<5;i++){const x=((i*225-scroll*.18)%(W+130)+W+130)%(W+130)-60;cloud(x,85+(i%3)*58,.7+(i%2)*.22)}
		ctx.fillStyle='#263d55';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#6cf2c5';ctx.fillRect(0,G,W,7);ctx.fillStyle='#45637a';for(let x=-(scroll%70);x<W;x+=70)ctx.fillRect(x,G+28,34,5);
		for(const q of coins){ctx.save();ctx.translate(q.x+12,q.y+12);ctx.scale(.72+Math.abs(Math.sin(time*5+q.phase))*.28,1);ctx.fillStyle='#ffb52e';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.strokeStyle='#fff08a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff2a1';ctx.beginPath();ctx.arc(-3,-3,3,0,7);ctx.fill();ctx.restore()}
		for(const o of obstacles){round(o.x,o.y,o.w,o.h,7,o.color);ctx.fillStyle='#ffffff55';ctx.fillRect(o.x+6,o.y+7,o.w-12,5);ctx.fillStyle='#152b42';ctx.fillRect(o.x+8,o.y+o.h-8,o.w-16,8)}
		// Simple runner animation: alternating legs, bobbing body, and glowing visor.
		const bob=player.grounded&&state==='playing'?Math.sin(player.run*2)*2:0,px=player.x,py=player.y+bob,swing=player.grounded?Math.sin(player.run*2)*8:0;ctx.fillStyle='#173b60';ctx.beginPath();ctx.ellipse(px+22,G+2,27,5,0,0,7);ctx.fill();round(px+9,py+40,11,17,5,'#ffb64d');round(px+24,py+40,11,17,5,'#ffb64d');ctx.strokeStyle='#173b60';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px+14,py+52);ctx.lineTo(px+10+swing,py+58);ctx.moveTo(px+29,py+52);ctx.lineTo(px+33-swing,py+58);ctx.stroke();round(px+2,py+5,39,43,12,'#ff765d');round(px+7,py+13,33,14,7,'#63f5db');ctx.fillStyle='#153b5c';ctx.beginPath();ctx.arc(px+30,py+19,2.5,0,7);ctx.fill();ctx.fillStyle='#ffd36e';ctx.beginPath();ctx.arc(px+8,py+40,5,0,7);ctx.fill();
		for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#ffe77b';ctx.beginPath();ctx.arc(p.x,p.y,3+3*p.life/p.max,0,7);ctx.fill()}ctx.globalAlpha=1}
	// One persistent requestAnimationFrame loop; dt is capped to avoid large physics jumps.
	function frame(now){const dt=Math.min((now-(last||now))/1000,.04);last=now;update(dt);draw();requestAnimationFrame(frame)}
	resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
